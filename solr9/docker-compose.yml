services:
  solr:
    image: ${BIREME_SOLR_IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    user: "${USER_GROUP_IDS}"
    restart: unless-stopped

    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    ports:
      - "${CONTAINER_PORT}:8983"
    env_file:
      - .env
    environment:
      # The mounted index dir is itself the Solr home (solr.xml + cores at its
      # root), so override the image default of /var/solr/data.
      - SOLR_HOME=/var/solr
    volumes:
      - ${IAHX_INDEX_PATH}:/var/solr
    healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/info/health || exit 1"]
        interval: 120s
        timeout: 10s
        retries: 3
    labels:
        autoheal: true
